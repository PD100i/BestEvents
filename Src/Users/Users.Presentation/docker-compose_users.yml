version: '3.8'

services:
  users-db:
    image: postgres:16-alpine
    container_name: bestevents-users-db
    ports:
       - "5435:5432"
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  users-db-data: