services:
  users.presentation:
    image: ${DOCKER_REGISTRY-}userspresentation
    build:
      context: .
      dockerfile: Users/Users.Presentation/Dockerfile
    environment:
      - ConnectionStrings__Default=Host=db-users;Port=5432;Database=users;Username=postgres;Password=postgres;
      - Kafka__BootstrapServers=kafka:29092
      - Jwt__SecretKey=${JWT_SECRET_KEY}
    ports:
      - "5001:8080"
    depends_on:
      - db-users
      - kafka

  events.presentation:
    image: ${DOCKER_REGISTRY-}eventspresentation
    build:
      context: .
      dockerfile: Events/Events.Presentation/Dockerfile
    environment:
      - ConnectionStrings__Default=Host=db-events;Port=5432;Database=events;Username=postgres;Password=postgres;
      - Kafka__BootstrapServers=kafka:29092
      - Jwt__SecretKey=${JWT_SECRET_KEY}
    ports:
      - "5002:8080"
    depends_on:
      - db-events
      - kafka


  bookings.presentation:
    image: ${DOCKER_REGISTRY-}bookingspresentation
    build:
      context: .
      dockerfile: Bookings/Bookings.Presentation/Dockerfile
    environment:
      - ConnectionStrings__Default=Host=db-bookings;Port=5432;Database=bookings;Username=postgres;Password=postgres;
      - Kafka__BootstrapServers=kafka:29092
      - Jwt__SecretKey=${JWT_SECRET_KEY}
    ports:
      - "5003:8080"
    depends_on:
      - db-bookings
      - kafka
        

  db-users:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d users"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db-events:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: events
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d events"] 
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  db-bookings:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bookings 
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bookings"] 
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk 

